# Package info, so you can `pip install -e .` if you want. requirements.txt is the simpler route.
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-analysis"
version = "0.2.0"
description = "Support-ticket analytics demo: clean -> batch K-means -> Claude API insights"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.25",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "openpyxl>=3.1",
  "anthropic>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.29", "plotly>=5.18"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["support_analysis*"]
